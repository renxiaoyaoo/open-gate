plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

def quoted = { value -> '"' + (value ?: '').replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace 'xyz.openhome.client'
    compileSdk 34
    defaultConfig {
        applicationId 'xyz.openhome.client'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'OPENHOME_BASE_URL', quoted(System.getenv('OPENHOME_BASE_URL') ?: 'https://example.invalid')
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    packagingOptions { jniLibs { useLegacyPackaging true } }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.tencent.iot.video:video-link-android:2.4.30'
    implementation 'com.tencent.iot.thirdparty.android:ijkplayer-java:2.0.19'
    implementation 'com.tencent.iot.thirdparty.android:ijkplayer-armv7a:2.0.19'
    implementation 'com.tencent.iot.thirdparty.android:ijkplayer-arm64:2.0.19'
}
